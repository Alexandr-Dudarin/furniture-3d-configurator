name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for model data checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check generated model data
        run: |
          python -m unittest discover -s assets/source -p test_generated_files.py
          python assets/source/wardrobes-integration/generate_runtime.py --check
          python assets/source/dressers-integration/generate_runtime.py --check

      - name: Lint
        run: npm run lint

      - name: Check handle previews
        run: npm run check:handle-previews

      - name: Test
        run: npm test -- --testTimeout=60000 --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Check published resources
        run: npm run check:publication
